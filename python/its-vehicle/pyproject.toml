[build-system]
requires = ["setuptools>=65.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "its-vehicle"
version = "0.0.1"
authors = [
  { name="Yann E. MORIN", email="yann.morin@orange.com" },
]
description = "ITS vehicle"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 4 - Beta",
]
license = "MIT"
dependencies = [
    "iot3 @ git+https://github.com/Orange-OpenSource/its-client@59c08f3dbee1ee30b7a625136004b753e43e0b22#subdirectory=python/iot3",
    "its-quadkeys @ git+https://github.com/Orange-OpenSource/its-client@fcc10a61b3242cc048ddf80d777d82ff87640eb8#subdirectory=python/its-quadkeys",
    "linuxfd==1.5",
]

[project.urls]
"Homepage" = "https://github.com/Orange-OpenSource/its-client"
"Bug Tracker" = "https://github.com/Orange-OpenSource/its-client/issues"

[project.scripts]
its-vehicle = "its_vehicle.main:main"
