plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

group 'com.orange.iot3core'
version '0.2.1-dev'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Internal dependencies, not exposed to consumers on their own compile classpath.
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.3'
    // OkHttp 5.x: required to align with opentelemetry-exporter-sender-okhttp (below), which is
    // used instead of the JDK HttpClient sender because java.net.http.HttpClient is not available
    // on Android.
    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation 'io.opentelemetry:opentelemetry-api:1.62.0'
    implementation 'io.opentelemetry:opentelemetry-sdk:1.62.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.62.0'
    implementation 'io.opentelemetry:opentelemetry-context:1.62.0'
    implementation 'org.json:json:20240303'

    implementation 'org.eclipse.leshan:leshan-core:2.0.0-M15'
    implementation 'org.eclipse.leshan:leshan-client-cf:2.0.0-M15'

    implementation 'org.slf4j:slf4j-jdk14:2.0.17'

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.2'
    // Mockito for mocking MQTT client internals
    testImplementation 'org.mockito:mockito-core:5.11.0'
    // OkHttp MockWebServer for BootstrapHelper/OpenTelemetryClient HTTP tests (mockwebserver3 is
    // the OkHttp 5.x-compatible artifact).
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.3.2'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

