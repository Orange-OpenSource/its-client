[package]
name = "libits-client"
version = "3.2.0"
authors = ["Frédéric Gardes <frederic.gardes@orange.com>", "Nicolas Buffon <nicolas.buffon@orange.com>"]
license = "MIT"
description = "library to connect on an ITS MQTT server"
homepage = "https://github.com/Orange-OpenSource/its-client"
documentation = "https://docs.rs/libits-client"
repository = "https://github.com/Orange-OpenSource/its-client.git"
readme = "README.md"
keywords = ["network", "its", "vehicle", "mqtt", "etsi"]
edition = "2024"

[lib]
name = "libits"
path = "src/lib.rs"
test = true
doctest = true
doc = true
crate-type = ["lib"]

[features]
mobility = ["geo"]
geo_routing = ["mobility"]
telemetry = ["base64", "opentelemetry", "opentelemetry-http", "opentelemetry-otlp", "opentelemetry_sdk"]
identity = []

[[example]]
name = "json_counter"

[[example]]
name = "telemetry"
required-features = ["telemetry"]

[[example]]
name = "copycat"
required-features = ["geo_routing"]

[[example]]
name = "collector"

[[example]]
name = "display_log_reader"
path = "examples/display/log/main.rs"
required-features = ["mobility"]

[[example]]
name = "display_mqtt_reader"
path = "examples/display/mqtt/main.rs"
required-features = ["mobility"]

[[example]]
name = "display_server"
path = "examples/display/server/main.rs"
required-features = ["mobility"]

[dependencies]
crossbeam-channel = "0.5.16"
enum_dispatch = "0.3.13"
integer-sqrt = "0.1.5"
log = "0.4.33"
map_3d = "0.1.7"
rust-ini = "0.21.3"
serde_json = "1.0.151"
serde_repr = "0.1.21"
thiserror = "2.0.20"
threadpool = "1.8.1"
flexi_logger = "0.31.10"
rand = "0.10.2"
tempfile = "3.27.0"
axum = "0.8.9"
anyhow = "1.0.104"
flate2 = "1.1.9"

[dependencies.tower-http]
version = "0.7.0"
features = ["fs", "cors"]

[dependencies.rusqlite]
version = "0.40.2"
features = ["bundled"]

[dependencies.base64]
version = "0.23.1"
optional = true

[dependencies.geo]
version = "0.33.1"
optional = true

[dependencies.opentelemetry]
version = "0.32.0"
optional = true

[dependencies.opentelemetry-http]
version = "0.32.0"
features = ["reqwest"]
optional = true

[dependencies.opentelemetry-otlp]
version = "0.32.0"
features = ["trace", "http-proto", "reqwest-blocking-client"]
optional = true

[dependencies.opentelemetry_sdk]
version = "0.32.1"
features = ["trace", "rt-tokio"]
optional = true

[dependencies.rumqttc]
version = "0.25.1"
features = ["websocket"]

[dependencies.reqwest]
version = "0.13.4"
features = ["json", "blocking"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_with]
version = "3.22.0"
features = ["json"]

[dependencies.tokio]
version = "1.53.1"
features = ["full", "macros"]

[dev-dependencies]
clap = "4.6.6"
chrono = "0.4.45"
criterion = "0.8.2"
lazy_static = "1.5.0"
timer = "0.2.0"
flate2 = "1.1.9"
tar = "0.4.46"

[[bench]]
name = "position"
harness = false
required-features = ["mobility"]

[profile.dev]
incremental = true
